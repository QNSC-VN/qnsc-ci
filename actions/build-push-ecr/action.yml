name: Build & Push image to Amazon ECR
description: >
  Set up Docker Buildx, log in to ECR via OIDC credentials already configured
  in the calling job, and build+push a single image.
  Caller must have already run `aws-actions/configure-aws-credentials` and
  `aws-actions/amazon-ecr-login`.

inputs:
  ecr-registry:
    description: ECR registry URL — `<account>.dkr.ecr.<region>.amazonaws.com`
    required: true
  image-name:
    description: ECR repository name, e.g. `<product>-api`
    required: true
  image-tag:
    description: Primary image tag, e.g. `sha-abc1234` or `v1.2.3`
    required: true
  extra-tags:
    description: >
      Extra tags to apply (newline-separated, no registry prefix needed).
      Leave empty to only push the primary tag.
    required: false
    default: ''
  dockerfile:
    description: Relative path to the Dockerfile
    required: false
    default: Dockerfile
  build-context:
    description: Docker build context path
    required: false
    default: '.'
  build-target:
    description: Dockerfile target stage (for multi-stage builds)
    required: false
    default: ''
  platforms:
    description: >
      Target platform(s) for the image, e.g. `linux/arm64` for Fargate Graviton
      tasks (~20% cheaper per vCPU-hour and GB-hour than x86). Must match the
      `cpu_architecture` on the ECS task definition, or the container fails to
      start with "image Manifest does not contain descriptor matching platform".

      Build on a runner of the SAME architecture — the reusable backend-deploy
      workflow takes a `runner` input for that. Cross-building under QEMU works but
      costs several times the build minutes on a pnpm + Nest compile, which is worse
      than the Fargate saving. Leave empty to build for the runner's own platform.
    required: false
    default: ''
  cache-scope:
    description: >
      Cache scope key — a unique value per image (e.g. `api`, `worker`, `migrator`).
      Used as the GHA cache scope; the registry backend keys on the image name instead
      and ignores this.
    required: false
    default: default
  cache-backend:
    description: >
      Where the build cache lives: `registry` (default) or `gha`.

      REGISTRY is the default because the GitHub Actions cache is capped at 10 GB PER
      REPOSITORY, shared with every other workflow in it. A product whose images carry
      multi-GB layers blows through that on its own and evicts constantly — qnsc-kb
      re-downloaded a 2.2 GB model on most builds while appearing to be cached, and
      starved the rest of the repo's caches doing it. Registry cache has no such cap.

      Cost is a `:buildcache` tag per image repository, a few GB at $0.10/GB-month. The
      ECR lifecycle policy leaves it alone: its rules key on the `v` and `sha-` prefixes
      and on untagged images, and `buildcache` is tagged and matches neither prefix.

      `gha` remains available for a product with small images that would rather not hold
      cache in ECR at all. Nothing else changes between the two.

      Requires a MUTABLE ECR repository, because each build overwrites the `buildcache`
      tag. That is not a new constraint: this action already pushes `latest` via
      `extra-tags`, which needs mutability for the same reason — a product whose
      repositories are IMMUTABLE (the ecr module's default) is already incompatible with
      this pipeline before cache enters it. rally, qnsc-kb and opshub all pass MUTABLE.
    required: false
    default: registry
  node-auth-token:
    description: >
      Token used by the Dockerfile's `pnpm install` to fetch private
      @qnsc-vn/* packages from GitHub Packages (mounted as build secret
      `node_auth_token`). Defaults to the job's GITHUB_TOKEN; the calling job
      must grant `packages: read`.
    required: false
    default: ${{ github.token }}

outputs:
  image-uri:
    description: Full URI of the pushed image (`registry/name:tag`)
    value: ${{ steps.expose.outputs.image-uri }}
  image-digest:
    description: Image digest (`sha256:...`) — use with attest-image for tamper-proof SLSA provenance
    value: ${{ steps.expose.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

    - name: Resolve tags
      id: tags
      shell: bash
      run: |
        PRIMARY="${{ inputs.ecr-registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}"
        TAGS="$PRIMARY"
        if [ -n "${{ inputs.extra-tags }}" ]; then
          while IFS= read -r t; do
            [ -n "$t" ] && TAGS="$TAGS"$'\n'"${{ inputs.ecr-registry }}/${{ inputs.image-name }}:$t"
          done <<< "${{ inputs.extra-tags }}"
        fi
        echo "tags<<EOF" >> "$GITHUB_OUTPUT"
        echo "$TAGS"      >> "$GITHUB_OUTPUT"
        echo "EOF"        >> "$GITHUB_OUTPUT"
        echo "image-uri=$PRIMARY" >> "$GITHUB_OUTPUT"

    - name: Build & push
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: ${{ inputs.build-context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.build-target }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        # `image-manifest=true,oci-mediatypes=true` is REQUIRED for ECR, not decoration:
        # buildx's default cache manifest type is not one ECR accepts, and without these
        # the export fails with "unsupported manifest media type" AFTER the image itself
        # has been pushed — a green build with a broken cache write.
        #
        # `mode=max` exports every intermediate stage, not just the final one. That is the
        # whole point for a multi-stage Dockerfile: the expensive layers here are `deps`
        # and the model bake, neither of which appears in the final image's own layers.
        #
        # Cache misses are not failures. `--cache-from` on a repository with no buildcache
        # tag yet is a no-op, so the first build after enabling this simply populates it.
        cache-from: ${{ inputs.cache-backend == 'gha'
          && format('type=gha,scope={0}', inputs.cache-scope)
          || format('type=registry,ref={0}/{1}:buildcache', inputs.ecr-registry, inputs.image-name) }}
        cache-to: ${{ inputs.cache-backend == 'gha'
          && format('type=gha,mode=max,scope={0}', inputs.cache-scope)
          || format('type=registry,ref={0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', inputs.ecr-registry, inputs.image-name) }}
        provenance: mode=max   # SLSA L3: full build graph with materials
        sbom: true             # embed SBOM as OCI attestation (CycloneDX)
        # Authenticates `pnpm install` against GitHub Packages for private
        # @qnsc-vn/* deps so a cold build (evicted cache) doesn't 401.
        secrets: |
          node_auth_token=${{ inputs.node-auth-token }}

    - name: Expose image URI and digest
      id: expose
      shell: bash
      run: |
        echo "image-uri=${{ steps.tags.outputs.image-uri }}" >> "$GITHUB_OUTPUT"
        echo "digest=${{ steps.build.outputs.digest }}"      >> "$GITHUB_OUTPUT"
